services:
  - type: web
    name: mannkidhun
    runtime: python
    plan: free
    region: oregon
    buildCommand: python -m pip install -r requirements.txt && npm ci && npm run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MANNKIDHUN_SECRET_KEY
        generateValue: true
      - key: MANNKIDHUN_COOKIE_SECURE
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
